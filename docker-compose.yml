services:
  postgres:
    image: postgres:16-alpine
    container_name: maison_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maison
      POSTGRES_PASSWORD: maison
      POSTGRES_DB: maison
    ports:
      - "5432:5432"
    volumes:
      - maison_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maison"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  maison_pgdata:
